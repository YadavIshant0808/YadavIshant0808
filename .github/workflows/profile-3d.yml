name: Generate 3D contribution graph

on:
  workflow_dispatch: {}
  schedule:
    # Once a day — contribution history changes at most once per day.
    - cron: "20 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.1
        env:
          # Same caveat as profile-summary.yml: for full contribution
          # history (including any private-repo contributions you've
          # opted to show publicly), this typically needs a Personal
          # Access Token rather than the default GITHUB_TOKEN. Create a
          # repo secret named CONTRIB3D_GITHUB_TOKEN and reference it
          # below. A bare GITHUB_TOKEN will still work for public-only
          # contribution data.
          GITHUB_TOKEN: ${{ secrets.CONTRIB3D_GITHUB_TOKEN }}
          USERNAME: YadavIshant0808

      - name: Move generated SVG into repo asset path
        run: |
          mkdir -p assets/generated
          # The action writes a fixed set of filenames into
          # ./profile-3d-contrib/ at repo root, e.g.:
          #   profile-3d-contrib/profile-night-view.svg
          #   profile-3d-contrib/profile-green-animate.svg
          #   profile-3d-contrib/profile-gitblock.svg
          #   ...(see action's own README for the full fixed list)
          # We only need the one that matches this profile's dark/crimson
          # theme, so we copy that single file to a stable path that
          # README.md references directly.
          cp profile-3d-contrib/profile-night-view.svg \
             assets/generated/profile-3d-contrib.svg

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/generated/profile-3d-contrib.svg; then
            echo "No changes to 3D contribution asset — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/profile-3d-contrib.svg
          git commit -m "chore: regenerate 3D contribution graph [automated]"
          git push
